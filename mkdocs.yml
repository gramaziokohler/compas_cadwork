site_name: COMPAS cadwork
site_url: https://gramaziokohler.github.io/compas_cadwork/
site_description: COMPAS package for integrating with cadwork.
repo_name: gramaziokohler
repo_url: https://github.com/gramaziokohler/compas_cadwork/
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026, ETH Zurich - Gramazio Kohler Research

extra:
  homepage: https://gramaziokohler.github.io/compas_cadwork/
  version:
    provider: mike

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/logo.png
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/stylesheets/custom.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - callouts:
      strip_period: no
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: "¤"
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

plugins:
  - search
  - mermaid2
  - autorefs
  - callouts
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: list
            filters: public
            group_by_category: true
            heading_level: 2
            inheritance_diagram_direction: TD
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_full_path: true
            show_root_heading: true
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Cadwork's Python Shell: getting-started/shell.md
      - Standalone Plugin: getting-started/plugin.md
  - Examples:
      - Basic Example: examples/basic.md
      - Computational Design: examples/computational-design.md
  - API Reference:
      - compas_cadwork: api/compas_cadwork.md
      - compas_cadwork.conversions: api/compas_cadwork.conversions.md
      - compas_cadwork.datamodel: api/compas_cadwork.datamodel.md
      - compas_cadwork.elements: api/compas_cadwork.elements.md
      - compas_cadwork.scene: api/compas_cadwork.scene.md
      - compas_cadwork.utilities: api/compas_cadwork.utilities.md
  - License: license.md
